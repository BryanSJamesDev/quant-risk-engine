[project]
name = "risk-engine"
version = "0.1.0"
description = "Real-time portfolio risk & analytics engine: a functional risk core, GARCH volatility forecasting, anomaly detection, and a live dashboard."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "yfinance>=0.2.40",
    "arch>=6.3",
    "streamlit>=1.35",
    "plotly>=5.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
